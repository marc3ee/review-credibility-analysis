<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            width: 500px;
            height: auto;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .button-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        button {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        #webScrapeButton {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }
        
        #webScrapeButton:hover {
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4);
        }
        
        #status {
            margin-top: 12px;
            font-size: 12px;
            color: #666;
            text-align: center;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }
        
        #results {
            margin-top: 12px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 12px;
        }
        
        /* Custom scrollbar */
        #results::-webkit-scrollbar {
            width: 6px;
        }
        
        #results::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }
        
        #results::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }
        
        #results::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
        
        .star {
            color: #ffc107;
            font-size: 14px;
        }
        
        /* Dropdown button styling */
        .dropdown-btn {
            background: #f8f9fa !important;
            color: #495057 !important;
            border: 1px solid #dee2e6 !important;
            border-radius: 4px !important;
            padding: 4px 8px !important;
            font-size: 11px !important;
            width: auto !important;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .dropdown-btn:hover {
            background: #e9ecef !important;
            transform: none !important;
            box-shadow: none !important;
        }
        
        /* Animation for dropdowns */
        .dropdown-content {
            animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                max-height: 0;
            }
            to {
                opacity: 1;
                max-height: 200px;
            }
        }
        
        /* Header styling */
        .header {
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }
        
        .header h3 {
            margin: 0;
            color: #333;
            font-size: 18px;
            font-weight: 600;
        }
        
        .header p {
            margin: 5px 0 0 0;
            color: #666;
            font-size: 12px;
        }

        /* Star rating summary styling */
        .star-summary {
            margin: 10px 0;
            padding: 15px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }

        .star-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .star-rating {
            font-size: 16px;
            font-weight: bold;
            color: #495057;
        }

        .star-credibility {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin: 8px 0;
        }

        .progress-fill {
            height: 100%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
            font-weight: bold;
        }

        .overall-summary {
            margin-top: 15px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            text-align: center;
        }

        .overall-credibility {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .summary-stats {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            font-size: 11px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 18px;
            font-weight: bold;
            display: block;
        }
    </style>
</head>
<body>
    <div class="header">
        <h3>InCrediView: A Review Credibility Analyzer</h3>
        <p>specially made for Lazada</p>
    </div>
    
    <div class="button-container">
        <button id="findReviewsButton">Analyze Current Page</button>
        <button id="webScrapeButton">Deep Scrape Analysis</button>
    </div>
    
    <div id="status" style="display: none;"></div>
    <div id="results"></div>
    
    <script src="popup.js"></script>
</body>
</html>

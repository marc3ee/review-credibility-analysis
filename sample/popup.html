<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            width: 450px;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        #status {
            margin-top: 12px;
            font-size: 12px;
            color: #666;
            text-align: center;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }
        
        #results {
            margin-top: 12px;
            max-height: 350px;
            overflow-y: auto;
            font-size: 12px;
        }
        
        /* Custom scrollbar */
        #results::-webkit-scrollbar {
            width: 6px;
        }
        
        #results::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }
        
        #results::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }
        
        #results::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
        
        .star {
            color: #ffc107;
            font-size: 14px;
        }
        
        /* Dropdown button styling */
        .dropdown-btn {
            background: #f8f9fa !important;
            color: #495057 !important;
            border: 1px solid #dee2e6 !important;
            border-radius: 4px !important;
            padding: 4px 8px !important;
            font-size: 11px !important;
            width: auto !important;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .dropdown-btn:hover {
            background: #e9ecef !important;
            transform: none !important;
            box-shadow: none !important;
        }
        
        /* Animation for dropdowns */
        .dropdown-content {
            animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                max-height: 0;
            }
            to {
                opacity: 1;
                max-height: 200px;
            }
        }
        
        /* Header styling */
        .header {
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }
        
        .header h3 {
            margin: 0;
            color: #333;
            font-size: 18px;
            font-weight: 600;
        }
        
        .header p {
            margin: 5px 0 0 0;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h3>Review Credibility Analyzer</h3>
        <p>Focused on Inconsistency & Authenticity</p>
    </div>
    
    <button id="findReviewsButton">Find & Analyze Reviews</button>
    <div id="status" style="display: none;"></div>
    <div id="results"></div>
    
    <script src="popup.js"></script>
</body>
</html>
